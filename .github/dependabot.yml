# Dependabot will run on day 14 of each month at 02:15 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "15 2 14 * *"
    open-pull-requests-limit: 20
    assignees:
      - "xenon-s"
    versioning-strategy: "increase"
